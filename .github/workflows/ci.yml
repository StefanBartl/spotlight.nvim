name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual re-run. Added after a GitHub Actions incident swallowed the
  # dispatch for two pushes to main: missed runs are not backfilled, so
  # without this the only way to get a gate to run over an already-pushed
  # commit is an empty commit on top of it.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stylua:
    name: stylua (format check)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: v2.5.2
          args: --check lua plugin TESTS

  luacheck:
    name: luacheck (lint)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      # Plain Lua 5.4, not LuaJIT: luacheck only needs *an* interpreter to run
      # on, and which dialect it lints for is set by `std = "luajit"` in
      # .luacheckrc — independent of the host. Pinning a LuaJIT build here buys
      # nothing and breaks when that exact tarball disappears upstream (the
      # commonly copied "luajit-2.1.0-beta3" now 404s).
      - uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.4"
      - uses: leafo/gh-actions-luarocks@v4
      - run: luarocks install luacheck 1.2.0
      - run: luacheck lua plugin TESTS

  tests:
    name: tests (headless nvim) (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      # One platform failing must not cancel the others: which of the three
      # broke is the whole information content of this job.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        # Windows runners default to PowerShell; one shell on all three keeps
        # the run step itself from being what differs between platforms.
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          path: spotlight.nvim
      # lib.nvim is a real runtime dependency (usercmd.composer for the
      # :Spotlight verb, store.project for persistence) — checked out as a
      # sibling so `rtp+=../lib.nvim` matches the local dev convention
      # documented in TESTS/README.md. ui.nvim (ui.kit.select for the list)
      # is NOT checked out here: TESTS/README.md's own "what is deliberately
      # not tested" section explains that the chooser float is exercised
      # only through ui.kit.select's own contract, never from this suite.
      - uses: actions/checkout@v5
        with:
          repository: StefanBartl/lib.nvim
          path: lib.nvim
          ref: ci-verified
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable
      - name: Run TESTS suite
        working-directory: spotlight.nvim
        run: |
          exec > >(tee -a "$RUNNER_TEMP/test-output.log") 2>&1
          nvim -n -i NONE --headless -u NONE -c "set rtp+=.,../lib.nvim" -c "luafile TESTS/run.lua" -c "qa!"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-output-tests-${{ matrix.os }}
          path: ${{ runner.temp }}/test-output.log
          if-no-files-found: ignore
